http {
    server {
        listen 443 http2;
        listen [::]:443 http2;

        server_name carpet-api-proxy-name.onrender.com; # Replace with your Render frontend's URL

        
        location /carpet/ { # Adjust this path to match how your frontend calls the backend
            proxy_pass http://43.205.42.216:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
events {
    worker_connections 1024;
}