http {
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name carpet-visualizer-react-app.onrender.com; # Replace with your Render frontend's URL

        ssl_certificate /etc/letsencrypt/live/your-frontend-app-name.onrender.com/fullchain.pem; # Render handles this
        ssl_certificate_key /etc/letsencrypt/live/your-frontend-app-name.onrender.com/privkey.pem;   # Render handles this
        ssl_trusted_certificate /etc/letsencrypt/live/your-frontend-app-name.onrender.com/chain.pem; # Render handles this

        location / { # Adjust this path to match how your frontend calls the backend
            proxy_pass http://43.205.42.216:8003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # You might need other location blocks for serving static assets if this proxy also handles that
        location / {
            return 301 https://$host$request_uri; # Redirect any HTTP to HTTPS
        }
    }
}
events {
    worker_connections 1024;
}